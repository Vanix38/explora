<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: http: data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Explora</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="chrome">
    <div id="tabbar">
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-btn" title="Nouvel onglet (Ctrl+T)">+</button>
      <span id="private-badge" hidden title="Rien n'est conservé à la fermeture de cette fenêtre : ni onglets, ni cookies, ni connexions">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 11c1.2-3 2.3-5 3.3-6 .4-.4 1-.5 1.5-.2l2.2 1.3h4l2.2-1.3c.5-.3 1.1-.2 1.5.2 1 1 2.1 3 3.3 6H3zm4 2a4 4 0 0 1 3.9 3.1 3 3 0 0 1 2.2 0A4 4 0 1 1 13 18a1 1 0 0 0-2 0 4 4 0 1 1-4-5zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
        Navigation privée
      </span>
    </div>
    <div id="toolbar">
      <button id="back" class="icon-btn" title="Précédent (Alt+←)" aria-label="Précédent">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Suivant (Alt+→)" aria-label="Suivant">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="reload" class="icon-btn" title="Recharger (F5)">&#8635;</button>
      <form id="address-form">
        <!-- Sélecteur moteurs / IA (rempli par renderer.js) -->
        <div id="engine-slot" role="toolbar" aria-label="Moteur de recherche ou IA"></div>
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="Rechercher ou saisir une adresse" />
        <button id="translate" type="button" class="icon-btn" title="Traduire la page" aria-label="Traduire la page" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.9 15.1 10.4 12.6l.03-.03A17.4 17.4 0 0 0 14.1 6H17V4h-7V2H8v2H1v2h11.2a15.8 15.8 0 0 1-3.2 5.4A15.6 15.6 0 0 1 6.7 8H4.7a17.6 17.6 0 0 0 2.98 4.6l-5.1 5 1.4 1.4 5-5 3.1 3.1.8-2zM18.5 10h-2L12 22h2l1.1-3h4.8l1.1 3h2l-4.5-12zm-2.6 7 1.6-4.3 1.6 4.3h-3.2z"/></svg>
          <span id="translate-progress" hidden></span>
        </button>
        <button id="star" type="button" class="icon-btn" title="Ajouter aux favoris (Ctrl+D)" aria-pressed="false">&#9734;</button>
      </form>
      <button id="split" class="icon-btn" title="Écran partagé (Ctrl+Shift+S)" aria-label="Écran partagé" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 5v14" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="adblock" class="icon-btn" title="Bloqueur de publicités">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.6 8 11 4.6-1.4 8-6 8-11V5l-8-3z"/></svg>
        <span id="adblock-count" hidden></span>
      </button>
      <browser-action-list id="extension-actions" partition="persist:main" alignment="bottom left"></browser-action-list>
      <button id="extensions" class="icon-btn" title="Extensions">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
      </button>
      <button id="app-menu" class="icon-btn" title="Menu" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav id="bookmarks-bar" aria-label="Barre de favoris" hidden>
      <div id="bookmarks-items"></div>
      <button id="bookmarks-more" type="button" class="bm" title="Autres favoris" hidden>&#187;</button>
    </nav>
  </header>
  <!-- Écran partagé : liseré du panneau actif et séparateurs, sous les pages -->
  <div id="split-layer" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
